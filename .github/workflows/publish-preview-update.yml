name: Publish Android Preview Update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        run: npm test

      - name: Run Expo diagnostics
        run: npm run doctor

      - name: Install EAS CLI
        run: npm install -g eas-cli@27.5.0

      - name: Verify Firebase preview configuration
        run: |
          if ! eas env:exec preview 'node scripts/verifyFirebaseApiKey.js' --non-interactive; then
            echo "::error::Set a valid EXPO_PUBLIC_FIREBASE_API_KEY in the Expo project's preview environment before publishing an update."
            exit 1
          fi

      - name: Publish update to the preview channel
        run: eas update --channel preview --environment preview --platform android --message "Fix Firebase sign-in configuration" --non-interactive
