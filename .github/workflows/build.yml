name: GitHub Local EAS APK Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
        
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        run: npm test

      - name: Run Expo diagnostics
        run: npm run doctor

      - name: Install EAS CLI
        if: github.event_name != 'pull_request'
        run: npm install -g eas-cli@27.5.0

      - name: Build APK Locally on GitHub Runner
        if: github.event_name != 'pull_request'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --local --non-interactive --output "$RUNNER_TEMP/jsm-app.apk"

      - name: Upload APK to GitHub Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: JSM-App-APK
          path: ${{ runner.temp }}/jsm-app.apk
          retention-days: 7
